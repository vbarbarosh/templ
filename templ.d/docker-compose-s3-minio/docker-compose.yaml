services:
  # https://hub.docker.com/r/minio/minio
  # https://github.com/minio/minio/tree/master/docs/orchestration/docker-compose
  minio1:
    image: minio/minio
    restart: always
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # --- virtual-host mode ---
      MINIO_DOMAIN: minio.test # all buckets become *.minio.test
      MINIO_SERVER_URL: http://minio.test:9000 # public URL MinIO puts in presigned links
      MINIO_BROWSER_REDIRECT_URL: http://console.minio.test:9001
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/data
