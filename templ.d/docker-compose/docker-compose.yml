version: '3.7'
services:
  app:
    build: .
    working_dir: /kb/com.vbarbarosh.commander
    command: 'npm start'
    volumes:
      - ../../:/kb:ro
    env_file:
      - ../.env
    links:
      - mysql

  # https://github.com/jubos/fake-s3
  # https://docs.min.io/docs/deploy-minio-on-docker-compose
  # https://github.com/minio/minio/tree/master/docs/orchestration/docker-compose
  minio1:
    image: minio/minio
    ports:
      - 9001:9000
    environment:
      MINIO_ACCESS_KEY: hello
      MINIO_SECRET_KEY: hello
    command: server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio1:9000/minio/health/live"]
      interval: 1m30s
      timeout: 20s
      retries: 3
      start_period: 3m

  nginx:
    image: nginx
    ports:
      - 8080:80
    links:
      - app
      - adminer
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0.32
    ports:
      - 33066:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=hello
      - MYSQL_USER=hello
      - MYSQL_PASSWORD=hello
    volumes:
      - ./var/mysql:/var/lib/mysql
# $ cat .env
# DB_HOST=127.0.0.1
# DB_PORT=33066
# DB_USERNAME=hello
# DB_PASSWORD=hello
# DB_DATABASE=hello

  adminer:
    image: adminer
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    links:
      - mysql
