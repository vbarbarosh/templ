services:

  mysql:
    image: mysql:8.4.4
    restart: always
    # network_mode: host
    volumes:
      - ./data:/var/lib/mysql
      - ./config/my-custom.cnf:/etc/mysql/conf.d/my-custom.cnf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      # $ mysql -S var-run-mysqld/mysqld.sock -uroot -proot classicmodels <<< 'show tables'
      - ./var-run-mysqld:/var/run/mysqld
    environment:
      MYSQL_ROOT_PASSWORD: root

