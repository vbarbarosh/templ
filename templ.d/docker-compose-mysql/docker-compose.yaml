services:

  mysql:
    image: mysql:8.4.4
    restart: always
    network_mode: host
    volumes:
      - ./data:/var/lib/mysql
      - ./config/my-custom.cnf:/etc/mysql/conf.d/my-custom.cnf
    environment:
      MYSQL_ROOT_PASSWORD: root

  redir:
    build: ./docker-redir
    restart: always
    network_mode: host
